<!doctype html>
<html lang="es" data-tema="auto">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover: en el iPhone la app ocupa también la zona de la "isla" y la barra inferior -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AstroKit</title>
  <meta name="description" content="Glosario, calculadoras, planificador y cuaderno de astrofotografía.">

  <!-- PWA: datos para "Añadir a pantalla de inicio" -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0d1424">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AstroKit">
  <link rel="apple-touch-icon" href="iconos/icono-180.png">
  <link rel="icon" href="iconos/icono.svg" type="image/svg+xml">

  <!--
    Aplicar el tema ANTES de pintar nada, para que de noche no haya un
    "fogonazo" blanco al abrir la app. Por eso va aquí, en línea y al principio.
  -->
  <script>
    try {
      var t = JSON.parse(localStorage.getItem('astrokit:tema') || '"auto"');
      var n = JSON.parse(localStorage.getItem('astrokit:noche') || 'false');
      document.documentElement.dataset.tema = t;
      if (n) document.documentElement.dataset.noche = 'si';
    } catch (e) { /* sin almacenamiento: se queda en "auto" */ }
  </script>

  <!-- Tipografías: Instrument Serif (titulares), Space Grotesk (texto), IBM Plex Mono (cifras).
       El service worker las guarda en caché la primera vez, así funcionan sin conexión. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;600&display=swap">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/modulos.css">
</head>
<body>
  <!--
    Iconos: un "sprite" SVG. Cada <symbol> se dibuja una vez aquí y luego se usa
    en cualquier sitio con <svg><use href="#i-nombre"/></svg>. Todos son de trazo,
    así toman el color del texto (currentColor) y cambian solos con el tema.
  -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-glosario" viewBox="0 0 24 24"><path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H19v15H5.5A1.5 1.5 0 0 0 4 19.5v-15Z"/><path d="M4 19.5A1.5 1.5 0 0 0 5.5 21H19v-3"/><path d="M8 7h7M8 10.5h5"/></symbol>
      <symbol id="i-optica" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3l3.5 6.5M21 12l-7 .5M16.5 19.5L12.5 14M7.5 19.5l2.8-6.4M3 12l6.8-1.2M7.5 4.5l4 5"/></symbol>
      <symbol id="i-cielo" viewBox="0 0 24 24"><path d="M3 20h18"/><path d="M5 20a7 7 0 0 1 14 0"/><path d="M12 3v2M4.2 6.2l1.4 1.4M19.8 6.2l-1.4 1.4"/><circle cx="12" cy="13" r="1.2" fill="currentColor"/></symbol>
      <symbol id="i-checklist" viewBox="0 0 24 24"><path d="M4 6.5l1.5 1.5L8.5 5M4 12.5l1.5 1.5 3-3M4 18.5l1.5 1.5 3-3"/><path d="M12 7h8M12 13h8M12 19h8"/></symbol>
      <symbol id="i-cuaderno" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="1.5"/><path d="M9 3v18M12 8h4M12 11.5h4"/></symbol>
      <symbol id="i-enlaces" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></symbol>
      <symbol id="i-luna" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></symbol>
      <symbol id="i-sol" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></symbol>
      <symbol id="i-auto" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17A8.5 8.5 0 0 0 12 3.5Z" fill="currentColor"/></symbol>
      <symbol id="i-oscuro" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M15.5 14.8A5.5 5.5 0 0 1 9.2 8.5a5.5 5.5 0 1 0 6.3 6.3Z" fill="currentColor"/></symbol>
      <symbol id="i-estrella" viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.8l-5.2 2.8 1-5.8-4.3-4.1 5.9-.8L12 3.5Z"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M8 12.3l2.6 2.6L16 9.5"/></symbol>
      <symbol id="i-buscar" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></symbol>
      <symbol id="i-azar" viewBox="0 0 24 24"><path d="M3 7h3.5c4 0 5.5 10 10 10H21M3 17h3.5c1.7 0 2.9-1.8 4-4M14 8.5c.8-.9 1.7-1.5 2.5-1.5H21"/><path d="M18.5 4.5L21 7l-2.5 2.5M18.5 14.5L21 17l-2.5 2.5"/></symbol>
      <symbol id="i-atras" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
      <symbol id="i-sig" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
      <symbol id="i-arriba" viewBox="0 0 24 24"><path d="M5 15l7-7 7 7"/></symbol>
      <symbol id="i-abajo" viewBox="0 0 24 24"><path d="M5 9l7 7 7-7"/></symbol>
      <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5"/><circle cx="12" cy="8" r=".6" fill="currentColor"/></symbol>
      <symbol id="i-cerrar" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
      <symbol id="i-telescopio" viewBox="0 0 24 24"><path d="M3.5 11.5l13-5 2 5-13 5-2-5Z"/><path d="M16.5 6.5l3-1 2 5-3 1M10 15l-3 6M12 14.3l3 6.7"/></symbol>
      <!-- Marca de AstroKit: una pequeña constelación -->
      <symbol id="i-marca" viewBox="0 0 32 32"><path d="M4 23L11 10l8 6 9-11" fill="none"/><g fill="currentColor" stroke="none"><circle cx="4" cy="23" r="1.8"/><circle cx="11" cy="10" r="2.4"/><circle cx="19" cy="16" r="1.6"/><circle cx="28" cy="5" r="2.8"/></g></symbol>
    </defs>
  </svg>

  <!-- Velo para atenuar el brillo en modo noche (una capa negra semitransparente encima de todo) -->
  <div class="velo-noche" id="velo" aria-hidden="true"></div>

  <div class="app">
    <!-- ===== CABECERA: siempre visible, con el botón de modo noche ===== -->
    <header class="cabecera">
      <a class="marca" href="#portada" aria-label="AstroKit, portada">
        <svg class="marca__icono"><use href="#i-marca"/></svg>
        <span class="marca__texto">Astro<em>Kit</em></span>
      </a>
      <div class="cabecera__titulo" id="titulo-modulo" aria-live="polite"></div>
      <div class="cabecera__acciones">
        <label class="atenuador" id="atenuador" title="Brillo en modo noche">
          <span class="sr">Brillo</span>
          <input type="range" min="0" max="80" step="5" value="0" id="brillo-noche">
        </label>
        <button class="boton-icono" id="boton-tema" type="button" aria-label="Cambiar tema claro/oscuro">
          <svg><use href="#i-auto"/></svg>
        </button>
        <button class="boton-noche" id="boton-noche" type="button" aria-pressed="false">
          <svg><use href="#i-luna"/></svg><span>Noche</span>
        </button>
      </div>
    </header>

    <!-- ===== NAVEGACIÓN: barra inferior en el móvil, columna lateral en pantallas grandes ===== -->
    <nav class="navegacion" id="navegacion" aria-label="Módulos"></nav>

    <!-- ===== CONTENIDO: aquí se monta el módulo activo ===== -->
    <main class="contenido" id="contenido" tabindex="-1">
      <!-- Este aviso solo se ve si el JavaScript no llega a arrancar: lo normal es
           abrir index.html con doble clic (file://), donde el navegador bloquea
           los módulos JS y los JSON por seguridad. app.js lo sustituye al arrancar. -->
      <section class="pronto">
        <h1 class="titular">Abre AstroKit<em>.</em></h1>
        <p class="entradilla">Para funcionar necesita un pequeño servidor local. En el Mac,
          haz doble clic en <strong>abrir_astrokit.command</strong> (en la carpeta AstroKit),
          o en la Terminal: <code>python3 -m http.server 8000</code> y visita
          <code>http://localhost:8000</code>.</p>
      </section>
    </main>
  </div>

  <!-- type="module" permite usar import/export entre archivos JS (necesita servidor, no file://) -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
